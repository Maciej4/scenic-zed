name = "Scenic"
grammar = "scenic"
path_suffixes = ["scenic", "sc"]
line_comments = ["# "]
tab_size = 4
hard_tabs = false
autoclose_before = ";:.,=}])"

brackets = [
  { start = "(", end = ")", close = true, newline = false },
  { start = "[", end = "]", close = true, newline = false },
  { start = "{", end = "}", close = true, newline = false },
  { start = "\"", end = "\"", close = true, newline = false, not_in = ["string", "comment"] },
  { start = "'", end = "'", close = true, newline = false, not_in = ["string", "comment"] },
]
